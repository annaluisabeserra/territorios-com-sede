[project]
name = "territorios-pipeline"
version = "0.1.0"
description = "Pipeline de dados do observatório Territórios com Sede (Instituto SDW)"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "duckdb>=1.1",
  "polars>=1.9",
  "pyarrow>=17",
  "pandas>=2.2",
  "geopandas>=1.0",
  "shapely>=2.0",
  "pyogrio>=0.10",
  "pandera>=0.21",
  "pyyaml>=6",
  "requests>=2.32",
  "dbfread>=2.0",
  "pyreaddbc>=1.1",
]

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.7"]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["site", "worker", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]
pythonpath = ["."]
