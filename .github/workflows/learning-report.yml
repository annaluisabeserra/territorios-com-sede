name: Relatório mensal de aprendizado
# Lê os agregados anônimos do Worker (se configurado) e abre uma Issue para revisão humana.
# Nada é publicado automaticamente: uma pessoa aprova o que vira FAQ, sinônimo de busca ou pergunta pronta.
on:
  schedule:
    - cron: "41 12 1 * *"
  workflow_dispatch:
permissions:
  issues: write
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    if: ${{ vars.LEARNING_REPORT_URL != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Baixar agregados do mês
        env:
          LEARNING_REPORT_URL: ${{ vars.LEARNING_REPORT_URL }}
          LEARNING_REPORT_TOKEN: ${{ secrets.LEARNING_REPORT_TOKEN }}
        run: |
          curl -fsS -H "Authorization: Bearer ${LEARNING_REPORT_TOKEN}" "${LEARNING_REPORT_URL}" -o report.json
      - name: Montar e abrir a Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node worker/scripts/report-to-markdown.mjs report.json > report.md
          gh issue create --title "Relatório mensal de aprendizado ($(date -u +%Y-%m))" --body-file report.md --label aprendizado || gh issue create --title "Relatório mensal de aprendizado ($(date -u +%Y-%m))" --body-file report.md
