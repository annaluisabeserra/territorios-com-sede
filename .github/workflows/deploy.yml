name: Deploy
# Gera data/public a partir de data/processed (ADR-007), constrói o site e publica.
# Destino padrão: Cloudflare Pages (precisa dos secrets CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID).
# GitHub Pages (plano de saída, ver HANDOFF.md) só é usado com a variável ENABLE_GITHUB_PAGES = true
# e Pages ativado em Settings → Pages (não disponível para repositório privado no plano gratuito).
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Atualização mensal de dados"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: true
jobs:
  build:
    # Depois da atualização de dados, só publica se ela terminou com sucesso (nunca dados parciais)
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      cloudflare: ${{ steps.target.outputs.cloudflare }}
    env:
      PUBLIC_CF_BEACON_TOKEN: ${{ vars.PUBLIC_CF_BEACON_TOKEN }}
      PUBLIC_LEARNING_ENDPOINT: ${{ vars.PUBLIC_LEARNING_ENDPOINT }}
      PUBLIC_ASSISTANT_ENABLED: ${{ vars.PUBLIC_ASSISTANT_ENABLED || 'false' }}
      SITE_URL: ${{ vars.SITE_URL || 'https://territorios.institutosdw.org' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: uv sync --locked
      - run: uv run python -m pipeline.run --only-build
      - run: npm --prefix site ci
      - run: npm --prefix site run build
      - id: target
        run: echo "cloudflare=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: site/dist
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist
  cloudflare:
    needs: build
    if: needs.build.outputs.cloudflare == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: dist
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=territorios-com-sede --branch=main
  github-pages:
    needs: build
    if: needs.build.outputs.cloudflare != 'true' && vars.ENABLE_GITHUB_PAGES == 'true'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v5
