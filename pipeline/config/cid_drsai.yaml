# Doenças Relacionadas ao Saneamento Ambiental Inadequado (DRSAI), CID-10.
# Base: classificação da Funasa (2010), derivada de Cairncross & Feachem (1993) e Mara & Feachem (1999).
# Os estudos variam no recorte (ex.: A09 e A01/A25). Escolhas e pendências em docs/METODOLOGIA.md e QUESTIONS.md.
# Formato dos códigos: categoria de 3 caracteres (ex.: A00) ou intervalo "A00-A09" (inclusivo, mesma letra).
# O SIH registra o diagnóstico principal (DIAG_PRINC) com 4 caracteres (ex.: A099); comparamos os 3 primeiros.
reference: >-
  FUNASA. Impactos na saúde e no Sistema Único de Saúde decorrentes de agravos relacionados a um
  saneamento ambiental inadequado. Brasília: Funasa, 2010. Cairncross S., Feachem R. Environmental health
  engineering in the tropics. 2. ed. Chichester: Wiley, 1993.
groups:
  feco_oral:
    label: Transmissão feco-oral
    layer: core
    codes: ["A00-A09", "B15"]
    note: Diarreias e gastroenterites infecciosas (A00–A09, incluindo febres tifoide e paratifoide A01) e hepatite A (B15).
  contato_agua:
    label: Contato com a água
    layer: core
    codes: ["A27", "B65"]
    note: Leptospirose (A27) e esquistossomose (B65).
  geo_helmintos:
    label: Geo-helmintos e teníases
    layer: core
    codes: ["B68-B69", "B76-B83"]
    note: Teníase e cisticercose (B68–B69), ancilostomíase, ascaridíase, estrongiloidíase, tricuríase e outras helmintíases (B76–B83).
  vetores:
    label: Transmitidas por inseto vetor
    layer: vectors
    codes: ["A90-A92", "A97", "A95", "B50-B54", "B55", "B57", "B74"]
    note: >-
      Dengue (A90–A91 até 2022; A97 na revisão da CID-10 adotada a partir de 2023 no SIH; ver METODOLOGIA),
      chikungunya e zika (A92),
      febre amarela (A95), malária (B50–B54), leishmanioses (B55), doença de Chagas (B57) e filariose (B74).
      A relação com o saneamento é mais indireta (água parada, drenagem e lixo).
layers:
  core:
    label: Núcleo conservador
    default: true
  vectors:
    label: Inclui doenças transmitidas por vetores
    default: false
