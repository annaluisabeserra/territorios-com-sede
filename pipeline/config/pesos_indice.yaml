# Índice de prioridade territorial (SPEC §6.6). Pesos somam 1.
# Cada componente é normalizado por percentil dentro da UF (0 = melhor situação, 100 = pior).
# Componente faltante: o peso é redistribuído entre os presentes da mesma dimensão;
# dimensão inteira faltante: o peso é redistribuído entre as dimensões presentes e o município é sinalizado.
min_dimensions_for_rank: 3
dimensions:
  acesso:
    label: Déficit de acesso
    weight: 0.30
    components:
      - { indicator: censo_sem_agua_rede_pct, direction: higher_is_worse }
      - { indicator: censo_sem_esgoto_adequado_pct, direction: higher_is_worse }
  saude:
    label: Carga de saúde
    weight: 0.25
    components:
      - { indicator: drsai_taxa_10mil, direction: higher_is_worse }
      - { indicator: drsai_custo_per_capita, direction: higher_is_worse }
  vulnerabilidade:
    label: Vulnerabilidade social
    weight: 0.20
    components:
      - { indicator: renda_domiciliar_pc, direction: lower_is_worse }
      - { indicator: pct_pop_quilombola_indigena, direction: higher_is_worse }
      - { indicator: cadunico_pct_pop, direction: higher_is_worse }
  clima:
    label: Risco climático e hídrico
    weight: 0.15
    components:
      - { indicator: decretos_seca_5a, direction: higher_is_worse }
      - { indicator: decretos_chuva_5a, direction: higher_is_worse }
  qualidade:
    label: Qualidade da água
    weight: 0.10
    components:
      - { indicator: sisagua_pct_fora_padrao, direction: higher_is_worse }
sensitivity:
  delta_points: 10   # variação de ±10 pontos percentuais em cada peso
  top_n: 20
