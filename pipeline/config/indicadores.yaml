# Fonte única da verdade dos indicadores (SPEC §6.10). A página de Metodologia do site e o
# dicionário de dados são gerados a partir deste arquivo.
#
# Campos:
#   label / short: nome completo e curto (pt-BR)
#   unit: pct | count | rate_10k | brl | brl_pc | years | index | days
#   direction: higher_is_better | higher_is_worse | neutral
#   source: id da fonte (ver docs/DATA_SOURCES.md)
#   formula: texto em linguagem simples
#   limitations: lista
#   map: true se vira camada do mapa; palette: sequential | diverging
#   group: acesso | saude | servico | contexto | indice | meta
indicators:
  populacao:
    label: População residente
    short: População
    unit: count
    direction: neutral
    group: contexto
    source: ibge_censo2022
    formula: Pessoas residentes no município na data de referência do Censo 2022 (1º de agosto de 2022).
    limitations: []
    map: false

  censo_agua_rede_pct:
    label: Moradores com água da rede geral (Censo)
    short: Água da rede (Censo)
    unit: pct
    direction: higher_is_better
    group: acesso
    source: ibge_censo2022
    formula: >-
      Moradores em domicílios particulares permanentes ocupados cuja forma principal de abastecimento é a
      rede geral de distribuição ÷ total de moradores nesses domicílios × 100.
    limitations:
      - Conta a forma principal declarada pelo domicílio, não a regularidade nem a qualidade da água.
      - Poço profundo ou artesiano pode ser adequado e não entra neste indicador.
    map: true
    palette: sequential

  censo_sem_agua_rede_pct:
    label: Moradores sem água da rede geral (Censo)
    short: Sem água da rede (Censo)
    unit: pct
    direction: higher_is_worse
    group: acesso
    source: ibge_censo2022
    formula: 100 − moradores com água da rede geral (%).
    limitations:
      - Ver o indicador "Moradores com água da rede geral".
    map: false

  censo_esgoto_adequado_pct:
    label: Moradores com esgoto adequado (Censo)
    short: Esgoto adequado (Censo)
    unit: pct
    direction: higher_is_better
    group: acesso
    source: ibge_censo2022
    formula: >-
      Moradores em domicílios cujo esgotamento é rede geral, rede pluvial ou fossa ligada à rede, ou fossa
      séptica/fossa filtro não ligada à rede ÷ total de moradores × 100. Segue o critério de atendimento
      adequado do Plansab.
    limitations:
      - Não informa se o esgoto coletado é tratado.
      - Rede pluvial pode receber esgoto sem tratamento.
    map: true
    palette: sequential

  censo_sem_esgoto_adequado_pct:
    label: Moradores sem esgoto adequado (Censo)
    short: Sem esgoto adequado (Censo)
    unit: pct
    direction: higher_is_worse
    group: acesso
    source: ibge_censo2022
    formula: 100 − moradores com esgoto adequado (%).
    limitations: []
    map: false

  censo_sem_esgoto_pessoas:
    label: Pessoas sem esgoto adequado (Censo)
    short: Pessoas sem esgoto
    unit: count
    direction: higher_is_worse
    group: acesso
    source: ibge_censo2022
    formula: Moradores em domicílios sem esgotamento adequado (soma das categorias inadequadas e sem banheiro).
    limitations: []
    map: false

  censo_lixo_coletado_pct:
    label: Moradores com coleta de lixo (Censo)
    short: Coleta de lixo
    unit: pct
    direction: higher_is_better
    group: acesso
    source: ibge_censo2022
    formula: Moradores em domicílios com lixo coletado no domicílio ou em caçamba ÷ total × 100.
    limitations: []
    map: false

  snis_agua_pct:
    label: Atendimento total de água (SNIS IN055)
    short: Água (SNIS)
    unit: pct
    direction: higher_is_better
    group: servico
    source: snis
    formula: População total atendida com abastecimento de água ÷ população total residente × 100 (IN055).
    limitations:
      - Autodeclarado pelos prestadores de serviço.
      - Municípios que não responderam ao SNIS no ano ficam sem dado.
      - A partir do ano de referência 2023 o SNIS foi substituído pelo SINISA (ver METODOLOGIA).
    map: true
    palette: sequential

  snis_esgoto_pct:
    label: Atendimento total de esgoto (SNIS IN056)
    short: Esgoto (SNIS)
    unit: pct
    direction: higher_is_better
    group: servico
    source: snis
    formula: >-
      População total atendida com esgotamento sanitário ÷ população total residente dos municípios
      atendidos com abastecimento de água × 100 (IN056).
    limitations:
      - Autodeclarado. Municípios sem prestador de esgoto declarado ficam sem dado (não zero).
    map: true
    palette: sequential

  snis_tratamento_pct:
    label: Esgoto tratado em relação à água consumida (SNIS IN046)
    short: Esgoto tratado
    unit: pct
    direction: higher_is_better
    group: servico
    source: snis
    formula: Volume de esgoto tratado ÷ volume de água consumido (descontada a água exportada) × 100 (IN046).
    limitations:
      - Autodeclarado. Pode passar de 100% quando há contribuição de outras fontes; valores acima de 100 são limitados a 100 e sinalizados.
    map: true
    palette: sequential

  snis_perdas_pct:
    label: Perdas na distribuição de água (SNIS IN049)
    short: Perdas de água
    unit: pct
    direction: higher_is_worse
    group: servico
    source: snis
    formula: (Volume produzido + importado − serviço − consumido) ÷ (produzido + importado − serviço) × 100 (IN049).
    limitations:
      - Depende da qualidade da macro e da micromedição do prestador.
    map: true
    palette: sequential

  drsai_internacoes:
    label: Internações por DRSAI (média anual)
    short: Internações DRSAI
    unit: count
    direction: higher_is_worse
    group: saude
    source: datasus_sih
    formula: >-
      Média anual, nos últimos N anos completos, das AIHs aprovadas (tipo 1, internação) cujo diagnóstico
      principal está na lista DRSAI (núcleo conservador), contadas pelo município de residência do paciente.
    limitations:
      - Só capta internações no SUS. Atendimentos ambulatoriais e na rede privada ficam de fora.
      - Depende da qualidade do registro do diagnóstico.
    map: false

  drsai_taxa_10mil:
    label: Internações por DRSAI por 10 mil habitantes
    short: Internações DRSAI / 10 mil
    unit: rate_10k
    direction: higher_is_worse
    group: saude
    source: datasus_sih
    formula: Internações por DRSAI (média anual) ÷ população do Censo 2022 × 10.000.
    limitations:
      - Em municípios pequenos poucos casos mudam muito a taxa. Ver o número absoluto.
    map: true
    palette: sequential

  drsai_valor_anual:
    label: Valor pago pelo SUS em internações por DRSAI (média anual)
    short: Custo SUS DRSAI
    unit: brl
    direction: higher_is_worse
    group: saude
    source: datasus_sih
    formula: Média anual do valor total das AIHs (VAL_TOT) por DRSAI, corrigido pelo IPCA para reais do ano-base.
    limitations:
      - É o valor pago pela tabela SUS, abaixo do custo econômico real da internação.
    map: false

  drsai_custo_per_capita:
    label: Custo SUS das internações por DRSAI por habitante
    short: Custo DRSAI por habitante
    unit: brl_pc
    direction: higher_is_worse
    group: saude
    source: datasus_sih
    formula: Valor anual (corrigido) ÷ população do Censo 2022.
    limitations: []
    map: true
    palette: sequential

  drsai_dias_anual:
    label: Dias de internação por DRSAI (média anual)
    short: Dias internados
    unit: days
    direction: higher_is_worse
    group: saude
    source: datasus_sih
    formula: Média anual da soma dos dias de permanência (DIAS_PERM) das internações por DRSAI.
    limitations: []
    map: false

  renda_domiciliar_pc:
    label: Rendimento domiciliar per capita (Censo)
    short: Renda per capita
    unit: brl
    direction: lower_is_worse
    group: contexto
    source: ibge_censo2022
    formula: Rendimento nominal médio mensal domiciliar per capita.
    limitations:
      - Valor nominal do ano de referência do Censo.
    map: false

  pct_pop_quilombola_indigena:
    label: População quilombola e indígena (% da população)
    short: Pop. quilombola e indígena
    unit: pct
    direction: neutral
    group: contexto
    source: ibge_censo2022
    formula: (Pessoas quilombolas + pessoas indígenas residentes) ÷ população total × 100.
    limitations:
      - Primeiro Censo a contar a população quilombola. Pode haver subcontagem em localidades de difícil acesso.
    map: false

  indice_prioridade:
    label: Índice de prioridade territorial
    short: Índice de prioridade
    unit: index
    direction: higher_is_worse
    group: indice
    source: derivado
    formula: >-
      Soma ponderada dos percentis (dentro da UF) de cinco dimensões: déficit de acesso (30%), carga de saúde
      (25%), vulnerabilidade social (20%), risco climático e hídrico (15%) e qualidade da água (10%). 0 a 100;
      quanto maior, maior a prioridade.
    limitations:
      - Índice relativo à UF. Ranking 1 não significa situação absoluta pior que a de outro estado.
      - Dados faltantes reponderam os pesos; municípios com poucas dimensões ficam sinalizados.
    map: true
    palette: sequential
