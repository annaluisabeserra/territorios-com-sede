# Cadeia de URLs por fonte (ADR-002). A primeira que responder é usada; o .meta.json registra qual.
# {uf_code} = código IBGE da UF (ex.: 29); {uf} = sigla (ex.: BA).
# kind: official (órgão produtor) | mirror (cópia pública rastreável do dado oficial).
# Base dos Dados (basedosdados.org): bucket público GCS, tabelas tratadas a partir das fontes oficiais.
# geobr (Ipea): malhas oficiais do IBGE e de outros órgãos convertidas para GeoParquet.

ibge_municipios:
  name: IBGE — Localidades (lista de municípios)
  license: Dados públicos IBGE (uso livre com citação)
  urls:
    - { kind: official, url: "https://servicodados.ibge.gov.br/api/v1/localidades/estados/{uf_code}/municipios" }
    - kind: mirror
      url: "https://storage.googleapis.com/basedosdados-public/one-click-download/br_bd_diretorios_brasil/municipio/municipio.csv.gz"
      note: Diretório de municípios da Base dos Dados (construído a partir da DTB/IBGE)

ibge_malhas:
  name: IBGE — Malha municipal 2022
  license: Dados públicos IBGE
  urls:
    - kind: official
      url: "https://servicodados.ibge.gov.br/api/v3/malhas/estados/{uf_code}?formato=application/vnd.geo+json&qualidade=intermediaria&intrarregiao=municipio"
    - kind: mirror
      url: "https://github.com/ipea/geobr_prep_data/releases/download/v2.0.0/municipalities_2022_simplified.parquet"
      note: geobr v2.0.0 (Ipea), malha municipal IBGE 2022 simplificada

ibge_semiarido:
  name: SUDENE/IBGE — Delimitação do Semiárido 2022
  license: Dados públicos
  urls:
    - kind: mirror
      url: "https://github.com/ipea/geobr_prep_data/releases/download/v2.0.0/semiarid_2022_simplified.parquet"
      note: geobr v2.0.0 (Ipea). Lista oficial de municípios do Semiárido (Resolução Condel/Sudene)

sidra_catalog:
  name: IBGE — Catálogo de agregados (API SIDRA v3)
  urls:
    - { kind: official, url: "https://servicodados.ibge.gov.br/api/v3/agregados" }

censo_populacao:
  name: IBGE — Censo 2022, população residente
  license: Dados públicos IBGE
  sidra: { keywords: ["população residente"], variable_keywords: ["população residente"] }
  urls:
    - kind: mirror
      url: "https://storage.googleapis.com/basedosdados-public/one-click-download/br_ibge_censo_2022/populacao_idade_sexo/populacao_idade_sexo_bdpro.csv.gz"
      note: Base dos Dados a partir da tabela SIDRA 9514 (população por sexo e idade)

censo_quilombola:
  name: IBGE — Censo 2022, pessoas quilombolas
  license: Dados públicos IBGE
  # "Moradores em domicílios com pelo menos um morador quilombola" inclui não quilombolas: excluída (1º teste real)
  sidra: { table_hint: 9578, keywords: ["quilombola"], variable_keywords: ["quilombola"], variable_exclude: ["domicilio"] }
  urls:
    - kind: mirror
      url: "https://storage.googleapis.com/basedosdados-public/one-click-download/br_ibge_censo_2022/populacao_grupo_idade_sexo_quilombola/populacao_grupo_idade_sexo_quilombola.csv.gz"
      note: Base dos Dados. Soma de células por idade e sexo; células sob sigilo vêm vazias (total levemente subestimado)

censo_raca:
  name: IBGE — Censo 2022, população por cor ou raça
  license: Dados públicos IBGE
  urls:
    - kind: mirror
      url: "https://storage.googleapis.com/basedosdados-public/one-click-download/br_ibge_censo_2022/populacao_grupo_idade_sexo_raca/populacao_grupo_idade_sexo_raca_bdpro.csv.gz"
      note: Base dos Dados a partir do SIDRA

censo_lixo:
  name: IBGE — Censo 2022, destino do lixo (moradores)
  license: Dados públicos IBGE
  urls:
    - kind: mirror
      url: "https://storage.googleapis.com/basedosdados-public/one-click-download/br_ibge_censo_2022/caracteristica_domicilio_grupo_idade_raca_destino_lixo/caracteristica_domicilio_grupo_idade_raca_destino_lixo_bdpro.csv.gz"
      note: Base dos Dados a partir do SIDRA

censo_agua:
  name: IBGE — Censo 2022, forma principal de abastecimento de água (moradores)
  license: Dados públicos IBGE
  sidra:
    keywords: ["abastecimento de água"]
    variable_keywords: ["moradores"]
    classification_keywords: ["abastecimento de água"]
    numerator: ["rede geral"]
  urls: []   # só oficial via catálogo SIDRA (não há espelho conhecido)

censo_esgoto:
  name: IBGE — Censo 2022, tipo de esgotamento sanitário (moradores)
  license: Dados públicos IBGE
  sidra:
    keywords: ["esgotamento sanitário"]
    variable_keywords: ["moradores"]
    classification_keywords: ["esgotamento sanitário"]
    numerator: ["rede geral", "fossa séptica"]
    extra_numerators:
      censo_esgoto_rede_pct: ["rede geral"]
  urls: []

snis:
  name: SNIS — Série histórica, informações e indicadores municipais de água e esgoto
  license: Dados públicos (Ministério das Cidades)
  official_reference: "https://app4.cidades.gov.br/serieHistorica/ (consulta interativa, sem API estável)"
  urls:
    - kind: mirror
      url: "https://storage.googleapis.com/basedosdados-public/one-click-download/br_mdr_snis/municipio_agua_esgoto/municipio_agua_esgoto.csv.gz"
      note: Base dos Dados, tabela br_mdr_snis.municipio_agua_esgoto (anos de referência 1995–2022)

sinisa:
  name: SINISA — Informações e indicadores municipais de água e esgoto
  license: Dados públicos (Ministério das Cidades)
  official_reference: "https://www.gov.br/cidades/pt-br/acesso-a-informacao/acoes-e-programas/saneamento/sinisa/resultados-sinisa"
  # Uma página por edição. O leitor procura nela as planilhas de água e de esgoto; edição ainda não publicada
  # só gera aviso. Para incluir uma edição nova, acrescente a página aqui.
  pages:
    - url: "https://www.gov.br/cidades/pt-br/acesso-a-informacao/acoes-e-programas/saneamento/sinisa/resultados-sinisa/resultados-sinisa-2024"
      reference_year: 2023
    - url: "https://www.gov.br/cidades/pt-br/acesso-a-informacao/acoes-e-programas/saneamento/sinisa/resultados-sinisa/resultados-sinisa-2025"
      reference_year: 2024
    - url: "https://www.gov.br/cidades/pt-br/acesso-a-informacao/acoes-e-programas/saneamento/sinisa/resultados-sinisa/resultados-sinisa-2026"
      reference_year: 2025
  # Nome interno (o mesmo do SNIS) → código SINISA e, na falta dele, padrão do cabeçalho (texto sem acento, minúsculo).
  # Códigos confirmados: IAG0001 = IN055, IES0001 = IN056, IES2003 = IN046 (Trata Brasil/GO Associados 2025; ABES 2025).
  indicators:
    snis_agua_pct: {module: agua, codes: [IAG0001], header: "atendimento total.*(agua|abastecimento)"}
    snis_perdas_pct: {module: agua, codes: [], header: "perdas? (na |de )?distribuicao"}
    snis_consumo_lhabdia: {module: agua, codes: [], header: "consumo medio per capita"}
    snis_esgoto_pct: {module: esgoto, codes: [IES0001], header: "atendimento total.*(esgot|rede coletora)"}
    snis_tratamento_pct: {module: esgoto, codes: [IES2003], header: "esgoto tratado.*agua consumida"}
    snis_tratamento_coletado_pct: {module: esgoto, codes: [], header: "(tratamento d[oe] esgoto coletado|esgoto coletado.*tratad)"}

ana_atlas_esgotos:
  name: ANA — Atlas Esgotos (2013)
  license: Dados públicos ANA
  urls:
    - kind: mirror
      url: "https://storage.googleapis.com/basedosdados-public/one-click-download/br_ana_atlas_esgotos/municipio/municipio.csv.gz"
      note: Base dos Dados a partir do Atlas Esgotos (ANA, 2017; referência 2013)

datasus_sih:
  name: DATASUS — SIH/SUS, AIH reduzida (RD)
  license: Dados públicos Ministério da Saúde
  # Arquivos por UF do estabelecimento e mês de processamento. Para contar por residência, o pipeline
  # lê os arquivos de todas as UFs listadas em residence_scope e filtra MUNIC_RES.
  url_template: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIHSUS/200801_/Dados/RD{uf}{yy}{mm}.dbc"
  residence_scope: all_ufs   # anos: calculadora.yaml → years_average

ipca:
  name: IBGE — IPCA (número-índice mensal)
  license: Dados públicos
  urls:
    - { kind: official, url: "https://api.bcb.gov.br/dados/serie/bcdata.sgs.433/dados?formato=json" }
    - kind: mirror
      url: "https://storage.googleapis.com/basedosdados-public/one-click-download/br_ibge_ipca/mes_brasil/mes_brasil.csv.gz"
      note: Base dos Dados (IBGE). Série termina em 07/2024

funai_terras_indigenas:
  name: FUNAI — Terras indígenas (polígonos)
  license: Dados públicos FUNAI
  urls:
    - kind: official
      url: "https://geoserver.funai.gov.br/geoserver/Funai/ows?service=WFS&version=1.0.0&request=GetFeature&typeName=Funai:tis_poligonais&outputFormat=application/json"
    - kind: mirror
      url: "https://github.com/ipea/geobr_prep_data/releases/download/v2.0.0/indigenouslands_2024_simplified.parquet"
      note: geobr v2.0.0 (Ipea) a partir da FUNAI, 2024

incra_quilombolas:
  name: INCRA — Territórios quilombolas (polígonos e fase do processo)
  license: Dados públicos INCRA
  official_reference: "https://certificacao.incra.gov.br/csv_shp/export_shp.py (Acervo Fundiário, camada de áreas quilombolas)"
  urls: []   # nenhuma URL estável verificada; ver docs/DATA_SOURCES.md

palmares_certidoes:
  name: Fundação Cultural Palmares — Comunidades remanescentes de quilombos certificadas
  license: Dados públicos
  official_reference: "https://www.gov.br/palmares/pt-br/departamentos/protecao-preservacao-e-articulacao/certificacao-quilombola"
  urls: []   # planilha publicada em página institucional sem endereço estável

ucs_uso_sustentavel:
  name: MMA/ICMBio — Unidades de conservação de uso sustentável (RESEX e RDS)
  license: Dados públicos (Cadastro Nacional de Unidades de Conservação)
  categories: ["Reserva Extrativista", "Reserva de Desenvolvimento Sustentável"]
  official_reference: "Cadastro Nacional de Unidades de Conservação (CNUC/MMA); sem arquivo de polígonos com endereço estável verificado"
  urls:
    - kind: mirror
      url: "https://storage.googleapis.com/basedosdados-public/one-click-download/br_geobr_mapas/unidade_conservacao/unidade_conservacao.csv.gz"
      note: Base dos Dados (geobr/Ipea a partir do CNUC/MMA), polígonos em WKT

censo_renda:
  name: IBGE — Censo 2022, rendimento domiciliar per capita
  license: Dados públicos IBGE
  sidra:
    keywords: ["rendimento"]
    variable_keywords: ["rendimento", "medio", "per capita"]
    variable_exclude: ["massa", "participacao"]   # massa = soma da renda de todos, não a média (1º teste real)
    units: ["reais"]
  urls: []

censo_indigenas:
  name: IBGE — Censo 2022, pessoas indígenas
  license: Dados públicos IBGE
  sidra: { keywords: ["indígena"], variable_keywords: ["pessoas indígenas"] }
  urls: []

sisagua:
  name: Ministério da Saúde — SISAGUA, controle mensal de parâmetros básicos
  license: Dados públicos Ministério da Saúde
  official_reference: "https://opendatasus.saude.gov.br/dataset/sisagua-controle-mensal-parametros-basicos"
  ckan_api: "https://opendatasus.saude.gov.br"
  ckan_package: sisagua-controle-mensal-parametros-basicos

s2id:
  name: MIDR — S2ID, reconhecimentos federais de situação de emergência e calamidade
  license: Dados públicos MIDR
  official_reference: "https://dadosabertos.mdr.gov.br/dataset/s2id_sedec"
  ckan_api: "https://dadosabertos.mdr.gov.br"
  ckan_package: s2id_sedec

cadunico:
  name: MDS — CadÚnico (dados agregados por município)
  official_reference: "VIS Data / Cecad (MDS)"
  unavailable_reason: "ferramentas do MDS sem API pública estável verificada"
  urls: []

siconfi:
  name: Tesouro Nacional — SICONFI, despesa municipal na função Saneamento (DCA Anexo I-E)
  license: Dados públicos Tesouro Nacional
  official_reference: "https://apidatalake.tesouro.gov.br/docs/siconfi/"
  api: "https://apidatalake.tesouro.gov.br/ords/siconfi/tt"
  pause_s: 0.3

datasus_sim:
  name: DATASUS — SIM, declarações de óbito por residência
  license: Dados públicos Ministério da Saúde
  url_template: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIM/CID10/DORES/DO{uf}{yyyy}.dbc"

monitor_secas:
  name: ANA — Monitor de Secas do Brasil (mapas mensais)
  license: Dados públicos ANA
  official_reference: "https://monitordesecas.ana.gov.br/dados-sig"
  page_template: "https://monitordesecas.ana.gov.br/dados-sig?ano={ano}"

censo_escolar:
  name: INEP — Censo Escolar, microdados da educação básica (escolas)
  license: Dados públicos INEP
  official_reference: "https://www.gov.br/inep/pt-br/acesso-a-informacao/dados-abertos/microdados/censo-escolar"
  url_template: "https://download.inep.gov.br/dados_abertos/microdados_censo_escolar_{ano}.zip"
